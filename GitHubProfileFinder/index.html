<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Profile Finder</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>GitHub Profile Finder</h1>
    </header>

    <!-- Search Section -->
    <section class="search-container">
        <input
            type="text"
            id="searchInput"
            placeholder="Enter GitHub Username"
        >

        <button id="searchBtn">
            Search
        </button>
    </section>

    <!-- Profile Information -->
    <section id="profile">
    <div class="placeholder">
        Search for a GitHub user to display profile.
    </div>
    </section>

    <!-- Repository List -->
   <section id="repositories">
    <div class="placeholder">
        Repositories will appear here.
    </div>
    </section>

    <!-- Recent Searches -->
    <section id="recent-searches">
    <div class="placeholder">
        No recent searches.
    </div>
    </section>

    <script src="script.js"></script>

</body>
</html>
